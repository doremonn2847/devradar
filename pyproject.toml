[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devradar"
version = "0.1.0"
description = "Background radar for coding-agent progress and tech news, delivered via Hermes on Telegram"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "openai>=1.40",
  "mcp>=2",
  "apscheduler>=3.10,<4",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
devradar = "devradar.worker:main"
devradar-mcp = "devradar.mcp_server:main"

[tool.setuptools.packages.find]
include = ["devradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
